# Tiny Tapeout project information
project:
  title:        "74181 4-bit ALU"
  author:       "brightwaterfall"
  discord:      ""
  description:  "Classic 74181 4-bit ALU (logic + arithmetic) for Tiny Tapeout"
  language:     "Verilog"
  clock_hz:     0

  tiles: "1x1"
  top_module:  "tt_um_gddwms_alu74181"

  source_files:
    - "alu74181.v"
    - "project.v"

pinout:
  # Inputs
  ui[0]: "A0"
  ui[1]: "A1"
  ui[2]: "A2"
  ui[3]: "A3"
  ui[4]: "B0"
  ui[5]: "B1"
  ui[6]: "B2"
  ui[7]: "B3"

  # Outputs
  uo[0]: "F0"
  uo[1]: "F1"
  uo[2]: "F2"
  uo[3]: "F3"
  uo[4]: "AeqB"
  uo[5]: "P_n"
  uo[6]: "G_n"
  uo[7]: "Cn4_n"

  # Bidirectional pins (used as inputs)
  uio[0]: "S0"
  uio[1]: "S1"
  uio[2]: "S2"
  uio[3]: "S3"
  uio[4]: "M"
  uio[5]: "Cn_n"
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
