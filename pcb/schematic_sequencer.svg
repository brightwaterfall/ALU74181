<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="24" y="36" font-size="22" font-weight="700" font-family="Segoe UI,Arial">74181 ALU test PCB — auto S0–S3 sequencer</text>
  <text x="24" y="58" font-size="13" fill="#444" font-family="Segoe UI,Arial">3.3 V from Tiny Tapeout demo board · cycles every ALU function (S=0..15) continuously</text>

  
  <rect x="40" y="90" width="220" height="140" rx="8" fill="#e8f4ff" stroke="#222" stroke-width="2"/>
  <text x="48" y="110" font-size="15" font-weight="700" font-family="Segoe UI,Arial">U1 NE555 + RV1</text>
  <text x="48" y="126" font-size="13" font-family="Segoe UI,Arial">Astable clock</text>
<text x="48" y="142" font-size="13" font-family="Segoe UI,Arial">R1/R2=10k, C1=10uF</text>
<text x="48" y="158" font-size="13" font-family="Segoe UI,Arial">RV1=100k rate pot</text>
<text x="48" y="174" font-size="13" font-family="Segoe UI,Arial">OUT → U2.CLK</text>
  
  <rect x="320" y="90" width="260" height="160" rx="8" fill="#fff4e0" stroke="#222" stroke-width="2"/>
  <text x="328" y="110" font-size="15" font-weight="700" font-family="Segoe UI,Arial">U2 74HC161</text>
  <text x="328" y="126" font-size="13" font-family="Segoe UI,Arial">ENT/ENP=/LOAD=/CLR = 3V3</text>
<text x="328" y="142" font-size="13" font-family="Segoe UI,Arial">Q0..Q3 = S0..S3</text>
<text x="328" y="158" font-size="13" font-family="Segoe UI,Arial">Free-run count 0..15</text>
<text x="328" y="174" font-size="13" font-family="Segoe UI,Arial">HOLD pulls ENP low to freeze</text>
  
  <rect x="640" y="90" width="400" height="200" rx="8" fill="#eaffea" stroke="#222" stroke-width="2"/>
  <text x="648" y="110" font-size="15" font-weight="700" font-family="Segoe UI,Arial">J_TT → Tiny Tapeout tile</text>
  <text x="648" y="126" font-size="13" font-family="Segoe UI,Arial">ui[3:0]←A  ui[7:4]←B</text>
<text x="648" y="142" font-size="13" font-family="Segoe UI,Arial">uio[3:0]←S0..S3 (from U2)</text>
<text x="648" y="158" font-size="13" font-family="Segoe UI,Arial">uio[4]←M  uio[5]←Cn_n</text>
<text x="648" y="174" font-size="13" font-family="Segoe UI,Arial">uio[6..7]←GND</text>
<text x="648" y="190" font-size="13" font-family="Segoe UI,Arial">uo[3:0]→F LEDs  uo[4]→AeqB LED</text>
<text x="648" y="206" font-size="13" font-family="Segoe UI,Arial">3V3, GND from demo board</text>

  
  <rect x="40" y="320" width="280" height="150" rx="8" fill="#f0e8ff" stroke="#222" stroke-width="2"/>
  <text x="48" y="340" font-size="15" font-weight="700" font-family="Segoe UI,Arial">SW_A / SW_B / M / Cn</text>
  <text x="48" y="356" font-size="13" font-family="Segoe UI,Arial">DIP4 A → ui[0:3]</text>
<text x="48" y="372" font-size="13" font-family="Segoe UI,Arial">DIP4 B → ui[4:7]</text>
<text x="48" y="388" font-size="13" font-family="Segoe UI,Arial">SPDT M → uio[4]</text>
<text x="48" y="404" font-size="13" font-family="Segoe UI,Arial">SPDT Cn_n → uio[5]</text>
<text x="48" y="420" font-size="13" font-family="Segoe UI,Arial">10k pull-downs to GND</text>
  
  <rect x="360" y="320" width="280" height="150" rx="8" fill="#ffe8e8" stroke="#222" stroke-width="2"/>
  <text x="368" y="340" font-size="15" font-weight="700" font-family="Segoe UI,Arial">LED bank</text>
  <text x="368" y="356" font-size="13" font-family="Segoe UI,Arial">F0..F3 + 330R → LED</text>
<text x="368" y="372" font-size="13" font-family="Segoe UI,Arial">AeqB + 330R → LED</text>
<text x="368" y="388" font-size="13" font-family="Segoe UI,Arial">Optional LEDs on S0..S3</text>
<text x="368" y="404" font-size="13" font-family="Segoe UI,Arial">Cathodes → GND</text>
  
  <rect x="680" y="320" width="360" height="150" rx="8" fill="#f5f5f5" stroke="#222" stroke-width="2"/>
  <text x="688" y="340" font-size="15" font-weight="700" font-family="Segoe UI,Arial">Decoupling</text>
  <text x="688" y="356" font-size="13" font-family="Segoe UI,Arial">100nF @ U1,U2 VCC</text>
<text x="688" y="372" font-size="13" font-family="Segoe UI,Arial">10uF bulk on 3V3</text>
<text x="688" y="388" font-size="13" font-family="Segoe UI,Arial">All logic 74HC @ 3.3V</text>

  
  <line x1="260" y1="160" x2="320" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290.0" y="154.0" font-size="12" text-anchor="middle" font-family="Segoe UI,Arial">CLK</text>
  
  <line x1="580" y1="160" x2="640" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610.0" y="154.0" font-size="12" text-anchor="middle" font-family="Segoe UI,Arial">S[3:0]</text>
  
  <line x1="320" y1="395" x2="640" y2="220" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480.0" y="301.5" font-size="12" text-anchor="middle" font-family="Segoe UI,Arial">A/B/M/Cn</text>
  
  <line x1="640" y1="250" x2="500" y2="320" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570.0" y="279.0" font-size="12" text-anchor="middle" font-family="Segoe UI,Arial">F / AeqB</text>

  <text x="24" y="560" font-size="13" font-family="Segoe UI,Arial">Behavior: with A,B,M,Cn fixed, S advances 0→1→…→15→0 so each 74181 function runs one after another; F LEDs update each step.</text>
  <text x="24" y="585" font-size="12" fill="#555" font-family="Segoe UI,Arial">Refs: bom.csv · connections.csv · SCHEMATIC.md · BRINGUP.md · 74181_alu_tester.kicad_pro</text>
  <text x="24" y="680" font-size="11" fill="#777" font-family="Segoe UI,Arial">brightwaterfall/ALU74181 · Apache-2.0</text>
</svg>
